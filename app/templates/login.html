<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azoth · Ingresar</title>
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<meta name="theme-color" content="#101114">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
{% for hoja in ["design-tokens","typography","surfaces","controls"] %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/' ~ hoja ~ '.css') }}">
{% endfor %}
</head>
<body>
<div class="login-wrap">
  <div class="login-card frame">
    <img src="{{ url_for('static', filename='img/logo-azoth.png') }}" alt="Azoth">
    <form method="post">
      <input type="hidden" name="siguiente" value="{{ siguiente }}">
      <label for="clave">Contraseña</label>
      <input id="clave" name="clave" type="password" autofocus required autocomplete="current-password">
      {% if error %}<p class="field-error">{{ error }}</p>{% endif %}
      <button class="btn" type="submit">Entrar</button>
    </form>
  </div>
</div>
</body>
</html>
